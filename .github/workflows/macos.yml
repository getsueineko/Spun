name: macos

on:
  push:
    branches: [main, feature/macos-port]
  pull_request:
    branches: [main, feature/macos-port]

# Qt 6.11 is not yet packaged for Homebrew's stable channel on the GitHub
# runner images we test against; pin to brew tap versions where needed and
# keep the workflow steps narrow so a missing tap fails fast and loud.
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      QT_VERSION: "6.11"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
        # Xcode 15.4 ships the macOS 14.5 SDK, which matches LSMinimumSystemVersion.

      - name: Install build dependencies via Homebrew
        # taglib ships its own pkg-config, Qt ships its own CMake config under
        # $(brew --prefix qt). We do NOT install the `qt` formula here because
        # the GitHub runner image already provides it under /opt/homebrew.
        run: |
          brew update
          brew install ninja pkg-config taglib

      - name: Build Spun
        run: ./scripts/build-macos.sh -DBUILD_TESTING=ON
        # build-macos.sh installs Qt + TagLib via brew internally, then runs
        # CMake with Ninja, macdeployqt, and sign-macos-bundle.sh as a single
        # pipeline. It exits non-zero on any failure, including the
        # /opt/homebrew stale-rpath check inside sign-macos-bundle.sh.

      - name: Run ctest
        run: |
          cd build
          ctest --output-on-failure -E 'spun-desktop-media'
        # spun-desktop-media brings up a private D-Bus session, which Linux's
        # MPRIS integration needs and macOS does not provide. Every other
        # test runs in offscreen mode on macOS.
